name: Effect CI

# CI of the pi-effect packages (packages/*-effect, effect/). Runs only in the fork: upstream never runs it.

on:
  push:
    branches: [effect]
  pull_request:
    branches: [effect]
  # Run on demand, without a commit: `gh workflow run "Effect CI" --ref effect`.
  workflow_dispatch:

concurrency:
  group: effect-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary:
    if: github.repository == 'effectified/pi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The boundary is checked against the merge base with main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Boundary
        run: node effect/scripts/check-boundary.ts origin/main

      - name: Dependency rules
        run: node effect/scripts/check-deps.ts

  check:
    if: github.repository == 'effectified/pi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sync check compares the wrapped Pi sources with their release tag, lists the commits after it and
          # reads the merge base with main: it needs the tags and the history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Also generates the gitignored model data the type check needs.
      - name: Build upstream
        id: upstream
        run: npm run build

      # The pi-env daemon, which env-effect's daemon tests run (they skip without it). The runner ships Rust.
      - name: Build the pi-env daemon
        run: npm run build:daemon --workspace packages/env

      # Upstream's whole check. Upstream's build fetches the model catalogs of the day, and upstream's tests name
      # models of them, so this step fails once a named model leaves a catalog (within hours of a sync, twice in two
      # days). It shows, and does not fail the job: the steps below check what is ours.
      - name: Upstream check
        continue-on-error: true
        run: npm run check

      # Format and lint of the pi-effect packages (oxfmt and oxlint, with the idiom rules of effect/AGENTS.md), and
      # the parts of upstream's check that read them and no catalog: pinned versions, declared runtime dependencies,
      # import style. Their types are the step "Types and Effect rules" below.
      - name: Check the pi-effect packages
        if: ${{ !cancelled() }}
        run: |
          node effect/scripts/style.ts
          npm run check:pinned-deps
          npm run check:runtime-deps
          npm run check:ts-imports

      # The packages' Pi pins against the tree: one version, the workspace's, named in COMPAT.md's first row, and
      # the record of the Pi declarations the packages use (effect/pi-surface/). Pi sources beyond the pinned release
      # (or a release tag this clone lacks) only warn here: upstream's main changes a wrapped package between
      # releases, and no commit here can fix that. pack.ts and vendor.ts, which make what a product installs, refuse.
      - name: Sync check
        if: ${{ !cancelled() && steps.upstream.outcome == 'success' }}
        run: node effect/scripts/sync.ts check origin/main --warn-unreleased

      - name: Build the pi-effect packages
        id: packages
        if: ${{ !cancelled() && steps.upstream.outcome == 'success' }}
        run: node effect/scripts/build.ts

      # The types of sources and tests and the rules of effect/AGENTS.md (the plugin block of effect/tsconfig.json) in
      # one pass of the Effect-patched tsrs, the Rust port of TypeScript 7 that @effect/tsgo ships. @effect/tsgo is
      # fetched by npm exec at an exact version, not installed by npm ci. The release build above checks the sources
      # again with upstream's pinned TypeScript 7.0.2.
      - name: Types and Effect rules
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: node effect/scripts/types.ts

      # Storage conformance runs in both lanes: on node:sqlite here, on bun:sqlite in the Bun lane.
      - name: Tests on Node
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          failed=0
          for dir in packages/*-effect/; do
            npm run test --workspace "${dir%/}" || failed=1
          done
          exit "$failed"

      - name: Tests on Bun
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: node effect/scripts/test-bun.ts

  # Upstream's own suites, unchanged, so a sync that breaks them is seen here. A red job here does not make the run
  # red: upstream's tests name models of the catalogs its build fetches that day, so they also fail for a catalog
  # change, on upstream's own `main` too. The run's result is the result of the pi-effect packages.
  upstream-tests:
    if: github.repository == 'effectified/pi'
    name: upstream tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coding-agent
          - name: durable
          - name: chord
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests and tui autocomplete tests.
      - name: Install system dependencies
        if: matrix.name != 'durable' && matrix.name != 'chord'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Build the pi-env daemon
        if: matrix.name == 'other'
        run: npm run build:daemon --workspace packages/env

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            npm run test --workspace "packages/$SUITE"
            exit 0
          fi
          # Every other upstream workspace; the pi-effect packages run in the check job.
          args=()
          for dir in packages/*/; do
            case "$dir" in packages/coding-agent/ | packages/durable/ | packages/chord/ | packages/*-effect/) continue ;; esac
            args+=(--workspace "${dir%/}")
          done
          npm run test:scripts
          npm run test --if-present "${args[@]}"
